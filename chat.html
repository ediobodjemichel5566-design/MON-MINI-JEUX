<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Assistant IA</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #020617; color: white; display: flex; justify-content: center; height: 100vh; }
    .app { width: 100%; max-width: 420px; display: flex; flex-direction: column; background: #0f172a; }
    .header { padding: 16px; background: #1e293b; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .header a { color: #34d399; text-decoration: none; font-size: 13px; }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 14px; max-width: 80%; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
    .bot { background: #1e293b; align-self: flex-start; }
    .user { background: #2563eb; align-self: flex-end; }
    .form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #1e293b; }
    input { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #1e293b; color: white; outline: none; }
    button { padding: 12px 16px; border-radius: 10px; border: none; background: #10b981; color: #020617; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <span>🤖 Assistant Gemini</span>
      <a href="/">← Retour au jeu</a>
    </div>
    <div class="messages" id="messages">
      <div class="msg bot">Bonjour ! Je suis connecté à Gemini. Posez-moi n'importe quelle question.</div>
    </div>
    <form class="form" onsubmit="envoyer(event)">
      <input id="champ" placeholder="Écrivez votre message..." autocomplete="off" />
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script>
    const box = document.getElementById('messages');
    const champ = document.getElementById('champ');

    function ajouterMsg(texte, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      div.textContent = texte;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    async function envoyer(e) {
      e.preventDefault();
      const q = champ.value.trim();
      if (!q) return;
      ajouterMsg(q, 'user');
      champ.value = '';

      const attente = ajouterMsg('Réflexion en cours...', 'bot');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: q })
        });
        const data = await res.json();
        attente.textContent = data.reply;
      } catch (err) {
        attente.textContent = 'Erreur réseau. Réessayez.';
      }
    }
  </script>
</body>
</html>
